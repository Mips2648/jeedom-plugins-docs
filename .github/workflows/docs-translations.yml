name: Docs translate

on:
  workflow_dispatch:
    inputs:
      target_languages:
        description: "Comma-separated target languages"
        required: false
        default: "en_US,es_ES"
  push:
    branches:
      - master
    paths:
      - '**/fr_FR/*.md'
      - '.github/workflows/docs-translations.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: Mips2648/docs-translations@v3
        with:
            deepl_api_key: ${{ secrets.DEEPL_API_KEY }}
            target_languages: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_languages || 'en_US,es_ES' }}
            documents_roots: 'arlo,clicksend,designImgSwitch,fail2ban,gotify,hydrao,influxdb,kroomba,linksys,logmanager,miele,modbus2mqtt,rocketchat,SmartMeterP1,stockexchange'
            memory_path: ${{ github.workspace }}/.translation_memory
